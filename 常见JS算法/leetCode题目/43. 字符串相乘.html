<script>
  const num1 = "123", num2 = "456";

  // 题目地址: https://leetcode.cn/problems/multiply-strings/
  // 题目描述: 给定两个非负整数 num1 和 num2，
  // 以字符串形式返回 num1 和 num2 的乘积。可以假设 num1 和 num2 不为零，并且不使用任何内置的 BigInteger 库或直接将输入转换为整数。
  // 示例: 输入: num1 = "2", num2 = "3" 输出
  const multiply = function (num1, num2) {
    if (num1 === '0' || num2 === '0') return '0';
    const m = num1.length, n = num2.length;
    const res = new Array(m + n).fill(0);
    for (let i = m - 1; i >= 0; i--) {
      for (let j = n - 1; j >= 0; j--) {
        const mul = (num1[i] - '0') * (num2[j] - '0'); // 字符串转数字:  - '0' 或  parseInt(num1[i])
        // 乘积加上当前位置已有的值
        const sum = mul + res[i + j + 1];
        res[i + j + 1] = sum % 10;
        // Math.floor 用于处理进位
        res[i + j] += Math.floor(sum / 10);
      }
    }
    // 拼接结果，去除前导0
    return res.join('').replace(/^0+/, '');
  };

  var dataa = multiply(num1, num2);
  console.log(dataa);
</script>
