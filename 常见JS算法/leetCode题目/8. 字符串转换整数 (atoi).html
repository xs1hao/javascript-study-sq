<script>

  var str = " -042asd12";

  /**
 * 官方解法
 */
  var myAtoi = function (str) {
    const number = parseInt(str, 10);

    if (isNaN(number)) {
      return 0;
    } else if (number < Math.pow(-2, 31) || number > Math.pow(2, 31) - 1) {
      return number < Math.pow(-2, 31) ? Math.pow(-2, 31) : Math.pow(2, 31) - 1;
    } else {
      return number;
    }
  };
  // 自己的解法--又丑又长
  var getData = function (str) {
    let res = '0';
    let s = str.replace(/^\s+/, '');
    if (!s.length) {
      return res;
    }
    if (s.startsWith('-')) {
      res = '-0';
      s = s.replace('-', '');
    }
    var arr = s.split('');
    for (var i = 0; i < arr.length; i++) {
      if (!/\d/.test(arr[i])) {
        break;
      }
      res += arr[i];
    }
    const result = res - '0';
    if (result < Math.pow(-2, 31)) {
      return Math.pow(-2, 31);
    }

    if (Math.pow(2, 31) < result) {
      return Math.pow(2, 31);
    }
    return result;

  }

  var dataa = getData(str);
  console.log(dataa);
</script>
